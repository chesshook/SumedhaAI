name: SUMEDHA search-core tests

on:
  push:
    branches: [sumedha-sl-ab-v1]
  pull_request:
    branches: [main]

jobs:
  search-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependency
        run: python -m pip install --upgrade pip python-chess
      - name: Compile source
        run: python -m compileall -q sumedha_sl
      - name: Test PVS search core
        run: python -m sumedha_sl.selftest
